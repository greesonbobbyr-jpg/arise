<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0B0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Strength log that tells you how much stronger you got, and what to do when a lift stalls.">
<title>Arise</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0A0B0F; --s1:#14161C; --s2:#1B1E26; --s3:#232732;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#F2F4F8; --tx2:#9AA3B2; --tx3:#5F6776;
  --cy:#3EE6FF; --cy-tint:rgba(62,230,255,.13); --cy-line:rgba(62,230,255,.35); --cy-ink:#061014;
  --gr:#B6FF3B; --gr-tint:rgba(182,255,59,.13);
  --rd:#FF5C5C; --rd-tint:rgba(255,92,92,.12);
  --r:12px; --t:160ms;
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-s:13px; --fs-m:15px; --fs-l:20px; --fs-xl:34px;
  --tabs:64px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--f-ui);font-size:var(--fs-m);line-height:1.4;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}.cy{color:var(--cy)}.gr{color:var(--gr)}.rd{color:var(--rd)}
.small{font-size:var(--fs-s)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}
h1{font-size:var(--fs-l);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h2{font-size:var(--fs-m);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{min-height:100%;padding-bottom:calc(var(--tabs) + var(--sab) + 12px)}
.screen{padding:calc(12px + var(--sat)) 16px 24px;max-width:560px;margin:0 auto;animation:fade var(--t) ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:14px}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--s1);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card.lift{padding:16px}
.hair{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;font-size:var(--fs-m);transition:transform var(--t),background var(--t),opacity var(--t);user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cy);color:var(--cy-ink);box-shadow:0 0 0 1px rgba(62,230,255,.2),0 8px 28px -10px rgba(62,230,255,.7)}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.btn.danger{background:var(--rd-tint);color:var(--rd)}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:var(--fs-s)}
.btn:disabled{opacity:.4;pointer-events:none}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--tx2)}
.icon-btn:active{background:var(--s2)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* inputs */
.field{display:block;margin-bottom:12px}
.field label{display:block;font-size:var(--fs-s);color:var(--tx2);margin-bottom:6px}
.in{width:100%;min-height:48px;background:var(--s2);border:0;border-radius:var(--r);padding:0 14px;color:var(--tx);outline:none;transition:box-shadow var(--t)}
.in:focus{box-shadow:inset 0 0 0 1.5px var(--cy)}
.in.num{text-align:center;font-size:var(--fs-l)}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;background:var(--s2);border-radius:var(--r);padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:9px;color:var(--tx2);font-weight:600}
.seg button.on{background:var(--s3);color:var(--cy)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabs) + var(--sab));padding-bottom:var(--sab);background:var(--s1);border-top:1px solid var(--line);display:flex;z-index:30}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:11px;font-weight:600;letter-spacing:.04em}
.tabs button.on{color:var(--cy)}
.tabs svg.i{width:24px;height:24px}

/* rest bar */
.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--tabs) + var(--sab) + 10px);background:var(--s2);border-radius:var(--r);box-shadow:0 12px 30px -10px rgba(0,0,0,.8),0 0 0 1px var(--line);z-index:29;overflow:hidden;transform:translateY(120%);transition:transform var(--t)}
.rest.on{transform:none}
.rest .bar{position:absolute;left:0;top:0;bottom:0;background:var(--cy-tint);transition:width 1s linear}
.rest .inner{position:relative;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;min-height:52px}
.rest .time{font-size:var(--fs-l);color:var(--cy);min-width:64px}
.rest .btn{min-height:40px;padding:0 14px}

/* level ring / hero */
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--s3)}
.ring .fg{stroke:var(--cy);stroke-linecap:round;transition:stroke-dashoffset 400ms ease}
.ring .rank{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:30px;font-weight:700;color:var(--cy);letter-spacing:-.02em}
.bigval{font-size:var(--fs-xl);line-height:1;letter-spacing:-.02em}
.prog{height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--cy);border-radius:3px;transition:width 400ms ease}
.prog.green>i{background:var(--gr)}

/* workout set table */
.exh{display:flex;align-items:center;gap:8px;margin:0 0 6px;min-height:44px}
.exh h2{flex:1;min-width:0;font-size:17px}
.thead,.set{display:grid;grid-template-columns:44px 1fr 1fr 1fr 48px;gap:6px;align-items:center}
.thead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600;text-align:center;padding:2px 0 6px}
.thead>:first-child{text-align:left;padding-left:8px}
.set-wrap{position:relative;overflow:hidden;border-radius:10px;margin-bottom:6px}
.set-del{position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--rd);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:var(--fs-s);border-radius:0 10px 10px 0}
.set{position:relative;background:var(--s1);padding:4px 4px 4px 0;border-radius:10px;transition:transform var(--t),background var(--t);touch-action:pan-y}
.set.done{background:#11272E}
.set.done .in{background:transparent}
.set.pr{animation:prflash 700ms ease-out}
@keyframes prflash{0%{background:#202B15;box-shadow:0 0 0 2px var(--gr)}100%{background:#11272E;box-shadow:none}}
.set .n{height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--tx2);border-radius:8px;font-family:var(--f-num)}
.set .n.w{color:var(--cy);font-size:var(--fs-s);letter-spacing:.06em}
.set .prev{height:48px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-family:var(--f-num);font-size:var(--fs-m);font-weight:500;border-radius:8px}
.set .prev:active{background:var(--s3);color:var(--tx)}
.set .in{height:48px;min-height:0;padding:0 4px;font-size:18px}
.set .ck{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--tx3);transition:background var(--t),color var(--t)}
.set.done .ck{background:var(--cy);color:var(--cy-ink);box-shadow:0 4px 16px -6px rgba(62,230,255,.7)}
.set.done .ck svg{animation:pop 200ms ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.exstats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 8px 2px;font-size:var(--fs-s);color:var(--tx2);min-height:28px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.badge.pr{background:var(--gr-tint);color:var(--gr)}
.badge.stall{background:var(--rd-tint);color:var(--rd)}
.badge.cy{background:var(--cy-tint);color:var(--cy)}
.badge.dimb{background:var(--s2);color:var(--tx2)}
.addset{width:100%;min-height:44px;color:var(--tx2);font-weight:600;border-radius:10px;background:var(--s1);margin-top:2px}
.addset:active{background:var(--s2)}
.exblock{margin-bottom:20px}
.name-in{background:transparent;border:0;outline:none;font-weight:700;font-size:var(--fs-l);letter-spacing:.02em;width:100%;min-height:44px;border-radius:8px;padding:0 6px;margin-left:-6px}
.name-in:focus{background:var(--s1)}
.timer{color:var(--tx2);font-size:var(--fs-m)}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border-radius:10px}
.lrow:active{background:var(--s2)}
.lrow .t{font-weight:600}
.lrow .s{font-size:var(--fs-s);color:var(--tx3)}
.lrow+.lrow{border-top:1px solid var(--line)}
.chk{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;justify-content:center;color:var(--cy-ink);flex:none}
.chk.on{background:var(--cy);box-shadow:none}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity var(--t)}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--sat) + 40px);background:var(--bg);border-radius:18px 18px 0 0;z-index:41;transform:translateY(100%);transition:transform 200ms ease-out;display:flex;flex-direction:column;box-shadow:0 -1px 0 var(--line)}
.sheet.on{transform:none}
.sheet .sh{padding:12px 16px 8px}
.sheet .body{flex:1;overflow-y:auto;padding:0 16px;-webkit-overflow-scrolling:touch}
.sheet .foot{padding:10px 16px calc(12px + var(--sab));border-top:1px solid var(--line);background:var(--s1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--s2);color:var(--tx2);font-size:var(--fs-s);font-weight:600;white-space:nowrap}
.chip.on{background:var(--cy);color:var(--cy-ink)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--t)}
.modal-bg.on{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:560px;background:var(--s1);border-radius:18px 18px 0 0;padding:20px 16px calc(16px + var(--sab));transform:translateY(20px);transition:transform var(--t);max-height:90vh;overflow-y:auto}
.modal-bg.on .modal{transform:none}
.modal h2{font-size:var(--fs-l);margin-bottom:8px}
.modal p{color:var(--tx2);margin-bottom:12px}
.modal .acts{display:flex;gap:10px;margin-top:16px}
.modal .acts .btn{flex:1}
.toast{position:fixed;left:16px;right:16px;top:calc(var(--sat) + 12px);z-index:60;background:var(--s3);color:var(--tx);padding:12px 16px;border-radius:var(--r);font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.8),0 0 0 1px var(--line);transform:translateY(-140%);transition:transform 200ms ease-out;text-align:center}
.toast.on{transform:none}
.toast.pr{color:var(--gr);box-shadow:0 10px 30px -10px rgba(0,0,0,.8),0 0 0 1px rgba(182,255,59,.4)}

/* progress */
.readout{font-size:17px;line-height:1.5;font-weight:500}
.spark{width:100%;height:44px;display:block}
.tier{margin-top:12px}
.tier .segs{display:flex;gap:3px;height:10px}
.tier .segs i{flex:1;position:relative;background:var(--s3);border-radius:3px;overflow:hidden}
.tier .segs i b{position:absolute;left:0;top:0;bottom:0;background:var(--cy-line);border-radius:3px}
.tier .segs i u{position:absolute;left:0;top:0;bottom:0;background:var(--cy);border-radius:3px}
.tier .labs{display:flex;margin-top:5px}
.tier .labs span{flex:1;text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.tier .labs span.on{color:var(--cy)}
.callout{margin-top:12px;padding:12px 14px;background:var(--rd-tint);border-left:3px solid var(--rd);border-radius:8px}
.callout b{display:block;color:var(--rd);margin-bottom:4px}
.callout p{color:var(--tx);font-size:var(--fs-s);line-height:1.45}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 .card{margin:0;padding:12px}
.stat3 .v{font-size:24px}
.bodymap{display:flex;justify-content:center;gap:24px;padding:6px 0 2px}
.bodymap svg{height:150px;width:auto}
.bodymap .m{fill:var(--s3)}
.bodymap .g{fill:var(--cy)}
.bodymap .sil{fill:none;stroke:var(--line2);stroke-width:1.2}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ach .a{background:var(--s2);border-radius:10px;padding:10px 8px;text-align:center;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ach .a .n{font-weight:700;font-size:var(--fs-s)}
.ach .a .d{font-size:11px;color:var(--tx3);line-height:1.25}
.ach .a.on{box-shadow:inset 0 0 0 1.5px var(--cy-line)}
.ach .a.on .n{color:var(--cy)}
.ach .a .dot{width:10px;height:10px;border-radius:50%;background:var(--s3)}
.ach .a.on .dot{background:var(--cy);box-shadow:0 0 10px var(--cy)}
.drag{touch-action:none;cursor:grab;color:var(--tx3);width:36px;height:44px;display:flex;align-items:center;justify-content:center}
.ritem{display:flex;align-items:center;gap:6px;background:var(--s1);border-radius:10px;padding:6px 8px 6px 0;margin-bottom:8px}
.ritem.dragging{opacity:.5}
.ritem input.in{min-height:44px;padding:0 6px;text-align:center;font-family:var(--f-num)}
/* v1.1 */
.set.beating{box-shadow:inset 0 0 0 1.5px var(--gr)}
.shadow{display:flex;align-items:center;gap:8px;padding:0 8px 8px;font-size:var(--fs-s);color:var(--tx3)}
.shadow .k{letter-spacing:.1em;text-transform:uppercase;font-size:10px;font-weight:700;color:var(--tx3)}
.shadow.beat .k,.shadow.beat .mono{color:var(--gr)}
.quest{border-left:3px solid var(--cy)}
.quest.done{border-left-color:var(--gr)}
.quest .title{font-weight:700;font-size:17px;margin:2px 0}
.chipx{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--s2);color:var(--tx2)}
.chipx.on{background:var(--cy-tint);color:var(--cy)}
.chipx.used{background:var(--s2);color:var(--tx3)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-num);font-size:5px;fill:var(--tx3)}
.chart .base{stroke:var(--tx3);stroke-dasharray:2 2;stroke-width:.6}
.chart .ln{stroke:var(--cy);stroke-width:1.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--cy);opacity:.09}
.chart .grid{stroke:var(--line);stroke-width:.5}
.lift.open .more{display:block}
.lift .more{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
.trow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;min-height:32px;align-items:center;font-size:var(--fs-s)}
.trow.h{color:var(--tx3);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.trow>:last-child{text-align:right}.trow>:nth-child(2){text-align:center}
.hist .lrow{cursor:pointer}
.hist .detail{padding:4px 4px 12px;border-top:1px solid var(--line)}
.hist .detail .exn{font-weight:600;font-size:var(--fs-s);margin:10px 0 4px}
.hist .detail .srow{display:grid;grid-template-columns:32px 1fr 1fr auto;gap:8px;font-size:var(--fs-s);color:var(--tx2);min-height:26px;align-items:center}
.hist .detail .srow .w{color:var(--cy);font-size:11px;font-weight:700}
.mh{margin:18px 4px 6px}
.rankup{position:fixed;inset:0;z-index:70;background:rgba(10,11,15,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;opacity:0;pointer-events:none;transition:opacity 200ms}
.rankup.on{opacity:1;pointer-events:auto}
.rankup .letter{font-family:var(--f-num);font-size:140px;line-height:1;font-weight:700;color:var(--cy);text-shadow:0 0 40px rgba(62,230,255,.5)}
.rankup.on .letter{animation:rise 500ms cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(24px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.rankup .sub{color:var(--tx2);font-size:var(--fs-m);text-align:center;max-width:280px;padding:0 16px}
.rankup .kicker{color:var(--gr)}
.cardimg{width:100%;border-radius:var(--r);display:block;margin:8px 0 4px}
.summary .v{font-size:var(--fs-xl);color:var(--cy);line-height:1}
.summary .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.summary .grid .card{margin:0;background:var(--s2)}
.summary .xp{color:var(--gr)}
.empty{text-align:center;color:var(--tx3);padding:28px 0}
.note{font-size:var(--fs-s);color:var(--tx3);line-height:1.45}
</style>
</head>
<body>
<div id="app"><div id="screen" class="screen"></div></div>

<nav class="tabs" id="tabs">
  <button data-tab="workout"><svg class="i" viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Workout</button>
  <button data-tab="routines"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Routines</button>
  <button data-tab="progress"><svg class="i" viewBox="0 0 24 24"><path d="M4 18L10 11l4 4 6-8"/><path d="M15 7h5v5"/></svg>Progress</button>
  <button data-tab="profile"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
</nav>

<div class="rest" id="rest"><div class="bar" id="restbar"></div><div class="inner">
  <span class="num time" id="resttime">0:00</span><span class="small muted grow" id="restlabel">Rest</span>
  <button class="btn ghost" id="restplus">+15s</button><button class="btn ghost" id="restskip">Skip</button></div></div>

<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet"></div>
<div class="modal-bg" id="modalbg"><div class="modal" id="modal"></div></div>
<div class="rankup" id="rankup"><span class="kicker">Rank up</span><div class="letter" id="rankup-letter">C</div><div class="sub" id="rankup-sub"></div><span class="small dim" style="margin-top:20px">Tap to continue</span></div>
<div class="toast" id="toast"></div>

<script src="core.js"></script>
<script>
(function(){
'use strict';
const C = window.ARISE_CORE, DAY = C.DAY;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const KEY = 'arise.v1';
const KG = 0.45359237;

// ---------- state ----------
const DEFAULT = () => ({
  profile: { bodyweight: 180, units: 'lb', sex: 'm', age: 30, defaultRest: 120, weeklyTarget: 3, name: 'Hunter', keepAwake: true, notify: 'unasked' },
  routines: [], sessions: [], active: null, custom: [], exRest: {},
  game: { xp: 0, achievements: {}, prs: [], rank: 'E', quest: null },
});
let state = DEFAULT();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') state = Object.assign(DEFAULT(), o);
      state.profile = Object.assign(DEFAULT().profile, state.profile || {});
      state.game = Object.assign(DEFAULT().game, state.game || {});
      ['routines', 'sessions', 'custom'].forEach(k => { if (!Array.isArray(state[k])) state[k] = []; });
      if (!state.exRest || typeof state.exRest !== 'object') state.exRest = {};
    }
  } catch (e) { console.warn('load failed', e); state = DEFAULT(); }
}
let saveErr = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); saveErr = false; }
  catch (e) { console.warn('save failed', e); if (!saveErr) { saveErr = true; toast('Could not save. Storage may be full.', 'rd'); } }
}

// ---------- exercises ----------
let EXS = [], exById = {};
function buildEx() {
  EXS = C.EX.concat(state.custom || []);
  exById = {}; EXS.forEach(e => exById[e.id] = e);
}
const P = () => state.profile;
const BW = () => +P().bodyweight || 0;

// units helpers (stored lb)
function fw(lb, dec) { // display weight
  const v = P().units === 'kg' ? lb * KG : lb;
  const d = dec == null ? (P().units === 'kg' ? 1 : 0) : dec;
  const s = (+v).toFixed(d);
  return s.replace(/\.0+$/, '');
}
function toLb(v) { v = +v || 0; return P().units === 'kg' ? v / KG : v; }
function fromLb(lb) { return P().units === 'kg' ? +(lb * KG).toFixed(1) : +(+lb).toFixed(1).replace(/\.0$/, ''); }
const U = () => P().units;
function fmtSet(ex, s) {
  if (!s) return '—';
  if (ex && ex.bw) return (+s.w ? '+' + fw(s.w) : 'BW') + ' × ' + s.r;
  return fw(s.w) + ' × ' + s.r;
}
function fmtTime(sec) { sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function fmtDur(ms) { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h ' + (m % 60) + 'm'; }
function pct(v, d) { return (v >= 0 ? '+' : '') + v.toFixed(d == null ? 1 : d) + '%'; }

// ---------- analysis cache ----------
let cache = null;
function invalidate() { cache = null; }
function analyses() {
  if (cache) return cache;
  const out = {};
  for (const ex of EXS) { const a = C.analyze(ex.id, state.sessions, ex, BW(), Date.now()); if (a) out[ex.id] = a; }
  cache = out; return out;
}
function usageCount() {
  const u = {};
  for (const s of state.sessions) for (const e of s.entries || []) u[e.exId] = (u[e.exId] || 0) + 1;
  return u;
}
function prevEntry(exId) {
  const ss = state.sessions.slice().sort((a, b) => b.date - a.date);
  for (const s of ss) for (const e of s.entries || []) if (e.exId === exId && e.sets && e.sets.length) return e;
  return null;
}
function allTimeBest(exId) { const a = analyses()[exId]; return a ? a.allTimeBest : 0; }
function lastBest(exId) { const a = analyses()[exId]; return a ? a.history[a.history.length - 1].best : 0; }
function tierInfo(ex, e1rm) {
  if (!ex.std || !BW() || !e1rm) return null;
  return C.percentile(e1rm / BW(), P().sex, P().age, ex.std);
}
// lifts with a formed baseline and a standards table, with their current tier
function strengthLifts() {
  const out = [], an = analyses();
  for (const id in an) { const a = an[id], ex = exById[id]; if (!ex || !ex.std || !a.formed) continue; const t = tierInfo(ex, a.current); if (t) out.push({ exId: id, name: ex.name, current: a.current, tier: t.tier, std: ex.std }); }
  return out;
}
function currentRank() { return C.rankFor(strengthLifts().map(l => l.tier)); }
function tierMap() { const m = {}; for (const l of strengthLifts()) m[l.exId] = l.tier; return m; }
function todayQuest() {
  const st = C.streak(state.sessions, P().weeklyTarget);
  const q = C.dailyQuest(analyses(), exById, st, Date.now());
  const g = state.game.quest;
  q.done = !!(g && g.key === q.key && g.done);
  return q;
}
function overallChange() {
  const f = Object.values(analyses()).filter(a => a.formed);
  return f.length ? C.median(f.map(a => a.change)) : null;
}
function gameCtx() {
  const an = analyses();
  let maxTier = -1;
  for (const id in an) { const t = tierInfo(exById[id], an[id].current); if (t && t.tier > maxTier) maxTier = t.tier; }
  const ratio = id => an[id] ? an[id].current / (BW() || 1) : 0;
  const maxReps = id => { let m = 0; for (const s of state.sessions) for (const e of s.entries || []) if (e.exId === id) for (const st of e.sets || []) if (!st.warmup && +st.r > m) m = +st.r; return m; };
  let maxVolume = 0; for (const s of state.sessions) maxVolume = Math.max(maxVolume, C.sessionVolume(s, exById, BW()));
  const ov = overallChange();
  return { sessions: state.sessions, prCount: (state.game.prs || []).length, streak: C.streak(state.sessions, P().weeklyTarget), maxTier, ratio, maxReps, maxVolume, overall: ov == null ? 0 : ov };
}
function checkAchievements() {
  const ctx = gameCtx(), fresh = [];
  for (const a of C.ACHIEVEMENTS) {
    if (state.game.achievements[a.id]) continue;
    let ok = false; try { ok = a.check(ctx); } catch (e) {}
    if (ok) { state.game.achievements[a.id] = Date.now(); fresh.push(a); }
  }
  return fresh;
}

// ---------- UI primitives ----------
let toastT = null;
function toast(msg, kind) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (kind === 'pr' ? ' pr' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400);
}
function modal(opts) {
  return new Promise(res => {
    const bg = $('#modalbg'), m = $('#modal');
    m.innerHTML = (opts.title ? '<h2>' + esc(opts.title) + '</h2>' : '') + (opts.html || (opts.body ? '<p>' + esc(opts.body) + '</p>' : '')) +
      '<div class="acts">' + (opts.buttons || [{ label: 'OK', primary: true, value: true }]).map((b, i) =>
        '<button class="btn ' + (b.primary ? 'primary' : b.danger ? 'danger' : 'ghost') + '" data-i="' + i + '">' + esc(b.label) + '</button>').join('') + '</div>';
    bg.classList.add('on');
    const close = v => { bg.classList.remove('on'); res(v); };
    $$('.acts button', m).forEach(b => b.onclick = () => { const o = (opts.buttons || [{ value: true }])[+b.dataset.i]; close(o.value !== undefined ? o.value : (o.onValue ? o.onValue(m) : true)); });
    bg.onclick = e => { if (e.target === bg && opts.dismissable !== false) close(null); };
    if (opts.onOpen) opts.onOpen(m);
  });
}
const confirmDlg = (title, body, label, danger) => modal({ title, body, buttons: [{ label: 'Cancel', value: false }, { label: label || 'Confirm', value: true, primary: !danger, danger: !!danger }] });
function icon(n) {
  const d = {
    check: '<path d="M5 12l5 5L20 7"/>', plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
    more: '<circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/>',
    drag: '<path d="M8 7h8M8 12h8M8 17h8"/>', back: '<path d="M15 5l-7 7 7 7"/>', trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
    timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2h4"/>', search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  }[n];
  return '<svg class="i" viewBox="0 0 24 24">' + d + '</svg>';
}

// ---------- navigation ----------
let tab = 'workout', sub = null; // sub: {view:'routine-edit', id}
function setTab(t) { tab = t; sub = null; render(); window.scrollTo(0, 0); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.tab); });

function render() {
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const s = $('#screen');
  if (tab === 'workout') s.innerHTML = state.active ? viewActive() : (sub && sub.view === 'history' ? viewHistory() : viewHome());
  else if (tab === 'routines') s.innerHTML = sub && sub.view === 'routine-edit' ? viewRoutineEdit() : viewRoutines();
  else if (tab === 'progress') s.innerHTML = viewProgress();
  else s.innerHTML = viewProfile();
  afterRender();
}

// ---------- HOME (no active workout) ----------
function levelCard() {
  const L = C.levelFromXp(state.game.xp), r = 30, circ = 2 * Math.PI * r;
  const rn = C.rankNext(strengthLifts(), BW(), P().sex, P().age);
  return '<div class="card"><div class="hero"><div class="ring"><svg viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="' + r + '"/><circle class="fg" cx="38" cy="38" r="' + r + '" stroke-dasharray="' + circ + '" stroke-dashoffset="' + (circ * (1 - L.frac)) + '"/></svg><div class="rank">' + rn.rank + '</div></div>' +
    '<div class="grow"><div class="kicker">' + esc(P().name || 'Hunter') + ' · Rank ' + rn.rank + '</div><div class="row" style="align-items:baseline;gap:8px"><span class="num bigval">' + L.level + '</span><span class="muted">level</span><span class="small dim mono grow">' + Math.round(L.into) + '/' + Math.round(L.need) + ' XP</span></div>' +
    '<div class="small muted" style="margin-top:2px">' + esc(unitText(rn.text)) + '</div></div></div></div>';
}
function questCard() {
  const st = C.streak(state.sessions, P().weeklyTarget);
  const frac = Math.min(1, st.thisWeek / st.target);
  const usedMon = st.shieldsUsed.length ? new Date(st.shieldsUsed[0]).toLocaleDateString(undefined, { month: 'short' }) : '';
  const shield = st.shieldReady ? '<span class="chipx on" title="One missed week per month is forgiven">Shield ready' + (usedMon ? ' · used ' + usedMon : '') + '</span>' : '<span class="chipx used">Shield used · ' + usedMon + '</span>';
  const shieldNote = '<span class="small dim grow" style="margin-left:8px">One missed week a month is forgiven.</span>';
  return '<div class="card"><div class="row" style="margin-bottom:8px"><div class="grow"><div class="kicker">This week</div><div style="font-weight:600;margin-top:2px">' +
    (st.metThisWeek ? 'Goal met. Keep the streak alive.' : st.left + ' session' + (st.left === 1 ? '' : 's') + ' left this week') + '</div></div>' +
    '<div style="text-align:right"><div class="num" style="font-size:24px;line-height:1" >' + st.thisWeek + '<span class="dim">/' + st.target + '</span></div><div class="small ' + (st.weeks ? 'gr' : 'dim') + '">' + st.weeks + ' wk streak</div></div></div>' +
    '<div class="prog' + (st.metThisWeek ? ' green' : '') + '"><i style="width:' + (frac * 100) + '%"></i></div><div class="row" style="margin-top:10px">' + shield + shieldNote + '</div></div>';
}
function dailyQuestCard() {
  const q = todayQuest();
  return '<div class="card quest' + (q.done ? ' done' : '') + '"><div class="row"><div class="grow"><div class="kicker">Daily quest' + (q.done ? ' · complete' : '') + '</div><div class="title">' + esc(q.title) + '</div><div class="small muted">' + esc(unitText(q.text)) + '</div></div>' +
    '<span class="num ' + (q.done ? 'gr' : 'cy') + '" style="font-size:var(--fs-l)">+' + q.xp + '</span></div></div>';
}
function prCountFor(sessionId) { return (state.game.prs || []).filter(p => p.sessionId === sessionId).length; }
function recentCard() {
  const recent = state.sessions.slice().sort((a, b) => b.date - a.date).slice(0, 3);
  if (!recent.length) return '';
  const rows = recent.map(s => { const n = s.entries.reduce((a, e) => a + e.sets.length, 0), prs = prCountFor(s.id);
    return '<div class="lrow" data-hist="' + esc(s.id) + '"><div class="grow"><div class="t">' + esc(s.name) + '</div><div class="s">' + C.fmtDate(s.date) + ' · ' + n + ' sets' + (prs ? ' · <span class="gr">' + prs + ' PR</span>' : '') + '</div></div><span class="small dim mono">' + (s.endedAt ? fmtDur(s.endedAt - s.date) : '') + '</span></div>'; }).join('');
  return '<div class="row" style="margin:16px 4px 6px"><span class="kicker grow">Recent</span><button class="small cy" id="see-history" style="font-weight:600">See all</button></div><div class="card hist" style="padding:4px 12px">' + rows + '</div>';
}
function viewHome() {
  const routines = state.routines.map(r => {
    const last = lastPerformed(r.id);
    return '<div class="lrow" data-start-routine="' + esc(r.id) + '"><div class="grow"><div class="t">' + esc(r.name) + '</div><div class="s">' + r.items.length + ' exercises' + (last ? ' · last ' + C.fmtDate(last) : ' · never done') + '</div></div><span class="btn ghost sm">Start</span></div>';
  }).join('');
  return '<div class="top"><h1>Arise</h1><span class="kicker">' + state.sessions.length + ' workouts</span></div>' + installCard() + levelCard() + dailyQuestCard() + questCard() +
    '<button class="btn primary full" id="start-empty" style="margin:4px 0 16px">Start empty workout</button>' +
    '<div class="kicker" style="margin:0 4px 6px">Routines</div><div class="card" style="padding:4px 12px">' + (routines || '<div class="empty small">No routines yet. Build one in the Routines tab.</div>') + '</div>' + recentCard();
}
// ---------- HISTORY ----------
let openHist = null;
function viewHistory() {
  const list = state.sessions.slice().sort((a, b) => b.date - a.date);
  let html = '<div class="top"><button class="icon-btn" id="h-back">' + icon('back') + '</button><h1 class="grow">History</h1><span class="kicker">' + list.length + ' workouts</span></div>';
  if (!list.length) return html + '<div class="empty">Nothing logged yet.</div>';
  let month = '';
  for (const s of list) {
    const m = new Date(s.date).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    if (m !== month) { month = m; html += (html.endsWith('</div>') && month ? '' : '') + '<div class="kicker mh">' + esc(m) + '</div><div class="card hist" style="padding:4px 12px">'; }
    const n = s.entries.reduce((a, e) => a + e.sets.length, 0), prs = prCountFor(s.id), open = openHist === s.id;
    html += '<div class="lrow" data-hist="' + esc(s.id) + '"><div class="grow"><div class="t">' + esc(s.name) + '</div><div class="s">' + C.fmtDate(s.date) + ' · ' + s.entries.length + ' exercises · ' + n + ' sets' + (prs ? ' · <span class="gr">' + prs + ' PR</span>' : '') + '</div></div><span class="small dim mono">' + (s.endedAt ? fmtDur(s.endedAt - s.date) : '') + '</span></div>';
    if (open) html += sessionDetail(s);
    // close the card when the next session is in another month
    const next = list[list.indexOf(s) + 1];
    if (!next || new Date(next.date).toLocaleDateString(undefined, { month: 'long', year: 'numeric' }) !== month) html += '</div>';
  }
  return html;
}
function sessionDetail(s) {
  const prIds = new Set((state.game.prs || []).filter(p => p.sessionId === s.id).map(p => p.exId));
  let html = '<div class="detail">';
  for (const e of s.entries) {
    const ex = exById[e.exId] || { name: '?' }; let wn = 0;
    html += '<div class="exn">' + esc(ex.name) + (prIds.has(e.exId) ? ' <span class="badge pr">PR</span>' : '') + '</div>';
    for (const st of e.sets) html += '<div class="srow"><span class="' + (st.warmup ? 'w' : 'dim') + '">' + (st.warmup ? 'W' : ++wn) + '</span><span class="mono">' + fmtSet(ex, st) + '</span><span class="mono dim">' + (st.warmup ? '' : fw(C.setE1RM(ex, st, BW())) + ' e1RM') + '</span><span></span></div>';
  }
  html += '<div class="row" style="margin-top:12px"><span class="small dim grow">Volume ' + fw(C.sessionVolume(s, exById, BW())) + ' ' + U() + '</span><button class="btn danger sm" data-delsess="' + esc(s.id) + '">Delete</button></div></div>';
  return html;
}
async function deleteSession(id) {
  const s = state.sessions.find(x => x.id === id); if (!s) return;
  if (!(await confirmDlg('Delete workout?', esc(s.name) + ' from ' + C.fmtDate(s.date) + ' will be removed from your log and your progress will be recalculated.', 'Delete', true))) return;
  state.sessions = state.sessions.filter(x => x.id !== id);
  state.game.prs = (state.game.prs || []).filter(p => p.sessionId !== id);
  invalidate(); save(); toast('Workout deleted'); openHist = null; render();
}
function lastPerformed(rid) { let m = 0; for (const s of state.sessions) if (s.routineId === rid && s.date > m) m = s.date; return m; }

// ---------- ACTIVE WORKOUT ----------
function startWorkout(routine) {
  const a = { id: uid(), startedAt: Date.now(), name: routine ? routine.name : defaultName(), routineId: routine ? routine.id : null, entries: [], rest: null };
  state.active = a;
  if (routine) for (const it of routine.items) addExerciseToActive(it.exId, it.sets, it.reps, it.restSec);
  save(); tab = 'workout'; sub = null; render(); requestWake();
}
function defaultName() { const h = new Date().getHours(); return (h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening') + ' workout'; }
function addExerciseToActive(exId, nSets, reps, restSec) {
  const ex = exById[exId]; if (!ex) return;
  const prev = prevEntry(exId);
  const n = nSets || (prev ? prev.sets.length : 3);
  const sets = [];
  for (let i = 0; i < n; i++) {
    const p = prev && prev.sets[i];
    sets.push({ w: p ? p.w : 0, r: p ? p.r : (reps || 0), warmup: !!(p && p.warmup), done: false });
  }
  state.active.entries.push({ exId, sets, rest: restSec || state.exRest[exId] || P().defaultRest });
}
function viewActive() {
  const a = state.active;
  const xp = liveXp();
  let html = '<div class="top"><input class="name-in" id="wname" value="' + esc(a.name) + '" aria-label="Workout name"><span class="num timer" id="elapsed">' + fmtTime((Date.now() - a.startedAt) / 1000) + '</span><button class="btn primary sm" id="finish">Finish</button></div>';
  html += '<div class="row small" style="margin:-6px 0 14px 2px"><span class="gr num" id="livexp">+' + xp + ' XP</span><span class="dim">this workout</span></div>';
  a.entries.forEach((e, ei) => {
    const ex = exById[e.exId] || { name: 'Unknown', id: e.exId };
    const prev = prevEntry(e.exId);
    html += '<div class="exblock" data-e="' + ei + '"><div class="exh"><h2>' + esc(ex.name) + '</h2><span class="small dim mono">' + fmtTime(e.rest) + '</span><button class="icon-btn" data-exmenu="' + ei + '">' + icon('more') + '</button></div>' + shadowLine(e, ex);
    html += '<div class="thead"><span>Set</span><span>Previous</span><span>' + U() + '</span><span>Reps</span><span></span></div>';
    let wn = 0;
    e.sets.forEach((s, si) => {
      const p = prev && prev.sets[si];
      const label = s.warmup ? 'W' : ++wn;
      html += '<div class="set-wrap"><div class="set-del" data-del="' + ei + ':' + si + '">Delete</div><div class="set' + (s.done ? ' done' : '') + '" data-s="' + si + '">' +
        '<button class="n' + (s.warmup ? ' w' : '') + '" data-warm="' + ei + ':' + si + '">' + label + '</button>' +
        '<button class="prev" data-prev="' + ei + ':' + si + '">' + (p ? fmtSet(ex, p) : '—') + '</button>' +
        '<input class="in num" type="number" inputmode="decimal" step="any" data-w="' + ei + ':' + si + '" value="' + (s.w ? fromLb(s.w) : (ex.bw ? '0' : '')) + '" placeholder="' + (ex.bw ? '+' + U() : U()) + '">' +
        '<input class="in num" type="number" inputmode="numeric" data-r="' + ei + ':' + si + '" value="' + (s.r || '') + '" placeholder="reps">' +
        '<button class="ck" data-ck="' + ei + ':' + si + '" aria-label="Complete set">' + icon('check') + '</button></div></div>';
    });
    html += '<button class="addset" data-addset="' + ei + '">+ Add set</button>';
    html += '<div class="exstats" id="exstats-' + ei + '">' + exStats(e, ex) + '</div></div>';
  });
  html += '<button class="btn ghost full" id="add-ex" style="margin-top:4px">' + icon('plus') + ' Add exercise</button>';
  html += '<button class="btn line full" id="cancel-wo" style="margin-top:12px;color:var(--tx2)">Discard workout</button>';
  return html;
}
function shadowTop(exId) { const a = analyses()[exId]; if (!a) return null; for (const h of a.history) if (Math.abs(h.best - a.allTimeBest) < 1e-6) return { top: h.top, best: a.allTimeBest }; return null; }
function shadowLine(e, ex) {
  const sh = shadowTop(e.exId); if (!sh) return '';
  return '<div class="shadow" id="shadow-' + state.active.entries.indexOf(e) + '"><span class="k">Shadow</span><span class="mono">' + fmtSet(ex, sh.top) + '</span><span class="dim">·</span><span class="mono">' + fw(sh.best) + ' e1RM</span></div>';
}
function refreshBeating(ei) {
  const e = state.active.entries[ei], ex = exById[e.exId], sh = shadowTop(e.exId); if (!sh) return;
  let any = false;
  e.sets.forEach((s, si) => {
    const row = $('.exblock[data-e="' + ei + '"] .set[data-s="' + si + '"]'); if (!row) return;
    const beat = !s.warmup && +s.r > 0 && C.setE1RM(ex, s, BW()) > sh.best + 1e-6;
    row.classList.toggle('beating', beat && !s.done); if (beat && s.done) any = true;

function bindSwipe(root) {
  let startX = 0, startY = 0, cur = null, dx = 0, horiz = null;
  root.addEventListener('touchstart', e => {
    const row = e.target.closest('.set'); if (!row) return;
    $$('.set').forEach(r => { if (r !== row) r.style.transform = ''; });
    cur = row; startX = e.touches[0].clientX; startY = e.touches[0].clientY; dx = 0; horiz = null;
  }, { passive: true });
  root.addEventListener('touchmove', e => {
    if (!cur) return;
    const x = e.touches[0].clientX - startX, y = e.touches[0].clientY - startY;
    if (horiz === null && (Math.abs(x) > 8 || Math.abs(y) > 8)) horiz = Math.abs(x) > Math.abs(y);
    if (!horiz) return;
    dx = Math.min(0, Math.max(-96, x)); cur.style.transition = 'none'; cur.style.transform = 'translateX(' + dx + 'px)';
  }, { passive: true });
  root.addEventListener('touchend', () => {
    if (!cur) return; cur.style.transition = '';
    cur.style.transform = dx < -50 ? 'translateX(-80px)' : ''; cur = null;
  });
}

  const tile = (x, y, label, val, unit) => { g.fillStyle = '#14161C'; g.beginPath(); g.roundRect(x, y, 280, 150, 20); g.fill(); k(label, x + 28, y + 26); g.fillStyle = '#F2F4F8'; g.font = '700 64px ' + mono; g.fillText(String(val), x + 28, y + 62); const vw = g.measureText(String(val)).width; if (unit) { g.fillStyle = '#9AA3B2'; g.font = '500 28px ' + ui; g.fillText(unit, x + 28 + vw + 14, y + 94); } };
  tile(100, 560, 'Level', L.level); tile(400, 560, 'Streak', st.weeks, 'wk'); tile(700, 560, 'Workouts', state.sessions.length);
  k('Top lifts · e1RM', 100, 780);
  if (!lifts.length) { g.fillStyle = '#9AA3B2'; g.font = '500 36px ' + ui; g.fillText('No formed baselines yet. Three sessions over 14 days unlock a lift.', 100, 830); }
  lifts.forEach((l, i) => { const y = 830 + i * 110; g.fillStyle = '#F2F4F8'; g.font = '600 44px ' + ui; g.fillText(l.name, 100, y); g.fillStyle = '#9AA3B2'; g.font = '500 30px ' + ui; g.fillText(C.TIERS[l.tier], 100, y + 52); g.textAlign = 'right'; g.fillStyle = '#3EE6FF'; g.font = '700 56px ' + mono; g.fillText(fw(l.current) + ' ' + U(), W - 100, y); g.textAlign = 'left'; if (i < lifts.length - 1) { g.strokeStyle = 'rgba(255,255,255,.08)'; g.beginPath(); g.moveTo(100, y + 96); g.lineTo(W - 100, y + 96); g.stroke(); } });
  g.fillStyle = '#5F6776'; g.font = '500 28px ' + ui; g.fillText(new Date().toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) + ' · estimates from published standards', 100, H - 120);
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], 'arise-rank-card.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: 'Arise rank card' }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  const url = URL.createObjectURL(blob);
  await modal({ title: 'Your rank card', html: '<img class="cardimg" src="' + url + '" alt="Rank card"><p class="small dim">Long-press the image to save or share it.</p>', buttons: [{ label: 'Done', primary: true, value: true }] });
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

// ---------- event wiring after render ----------
function afterRender() {
  const s = $('#screen');
  if (tab === 'workout' && !state.active && sub && sub.view === 'history') {
    $('#h-back').onclick = () => { sub = null; openHist = null; render(); };
    $$('[data-hist]').forEach(el => el.onclick = () => { openHist = openHist === el.dataset.hist ? null : el.dataset.hist; render(); });
    $$('[data-delsess]').forEach(b => b.onclick = e => { e.stopPropagation(); deleteSession(b.dataset.delsess); });
  } else if (tab === 'workout' && !state.active) {
    $('#start-empty').onclick = () => startWorkout(null);
    $$('[data-start-routine]').forEach(el => el.onclick = () => startWorkout(state.routines.find(r => r.id === el.dataset.startRoutine)));
    const sh = $('#see-history'); if (sh) sh.onclick = () => { sub = { view: 'history' }; render(); };
    const hi = $('#home-install'); if (hi) hi.onclick = doInstall;
    $$('[data-hist]').forEach(el => el.onclick = () => { openHist = el.dataset.hist; sub = { view: 'history' }; render(); });
  }
  if (tab === 'workout' && state.active) { requestWake(); state.active.entries.forEach((e, i) => refreshBeating(i)); }
  if (tab === 'progress') {
    $$('[data-lift]').forEach(el => el.onclick = e => { if (e.target.closest('.callout')) return; expandedLift = expandedLift === el.dataset.lift ? null : el.dataset.lift; $$('[data-lift]').forEach(x => x.classList.toggle('open', x.dataset.lift === expandedLift)); });
  }
  if (tab === 'workout' && state.active) {
    $('#wname').oninput = e => { state.active.name = e.target.value; save(); };
    $('#finish').onclick = finishWorkout;
    $('#add-ex').onclick = () => openPicker(ids => { ids.forEach(id => addExerciseToActive(id)); save(); render(); });
    $('#cancel-wo').onclick = async () => { if (await confirmDlg('Discard workout?', 'Completed sets in this workout will be lost.', 'Discard', true)) { state.active = null; stopRest(); save(); render(); } };
  }
  if (tab === 'routines' && !(sub && sub.view === 'routine-edit')) {
    $('#new-routine').onclick = () => { draft = { id: uid(), name: '', items: [], isNew: true }; sub = { view: 'routine-edit' }; render(); };
    $$('[data-edit-routine]').forEach(b => b.onclick = () => { const r = state.routines.find(x => x.id === b.dataset.editRoutine); draft = JSON.parse(JSON.stringify(r)); sub = { view: 'routine-edit' }; render(); });
    $$('[data-start-routine]').forEach(b => b.onclick = async () => {
      if (state.active && !(await confirmDlg('Workout in progress', 'Starting a routine will discard the current workout.', 'Discard and start', true))) return;
      startWorkout(state.routines.find(r => r.id === b.dataset.startRoutine));
    });
  }
  if (tab === 'routines' && sub && sub.view === 'routine-edit') {
    $('#r-back').onclick = () => { sub = null; draft = null; render(); };
    $('#r-save').onclick = () => {
      readDraft(); if (!draft.name) { toast('Give the routine a name'); $('#r-name').focus(); return; }
      if (!draft.items.length) { toast('Add at least one exercise'); return; }
      const clean = { id: draft.id, name: draft.name, items: draft.items.map(i => ({ exId: i.exId, sets: i.sets, reps: i.reps, restSec: i.restSec })) };
      const idx = state.routines.findIndex(r => r.id === draft.id); if (idx >= 0) state.routines[idx] = clean; else state.routines.push(clean);
      save(); sub = null; draft = null; toast('Routine saved'); render();
    };
    $('#r-add').onclick = () => { readDraft(); openPicker(ids => { ids.forEach(id => draft.items.push({ exId: id, sets: 3, reps: 8, restSec: state.exRest[id] || P().defaultRest })); render(); }); };
    $$('[data-rdel]').forEach(b => b.onclick = () => { readDraft(); draft.items.splice(+b.dataset.rdel, 1); render(); });
    const del = $('#r-delete'); if (del) del.onclick = async () => { if (await confirmDlg('Delete routine?', draft.name + ' will be removed. Past workouts are kept.', 'Delete', true)) { state.routines = state.routines.filter(r => r.id !== draft.id); save(); sub = null; draft = null; render(); } };
    bindDrag();
  }
  if (tab === 'profile') bindProfile();
}

// Delegated listeners for the active workout, bound ONCE (the #screen element persists across renders).
function bindWorkoutDelegates() {
  const s = $('#screen');
  bindSwipe(s);
  s.addEventListener('input', e => {
    if (tab !== 'workout' || !state.active) return;
    const t = e.target; const key = t.dataset.w || t.dataset.r; if (!key) return;
    const [ei, si] = key.split(':').map(Number); readSetInputs(ei, si); save(); refreshExStats(ei);
  });
  s.addEventListener('click', async e => {
      if (tab !== 'workout' || !state.active) return;
      const ck = e.target.closest('[data-ck]'); if (ck) { const [ei, si] = ck.dataset.ck.split(':').map(Number); completeSet(ei, si); return; }
      const pv = e.target.closest('[data-prev]'); if (pv) {
        const [ei, si] = pv.dataset.prev.split(':').map(Number); const en = state.active.entries[ei]; const p = prevEntry(en.exId); const ps = p && p.sets[si]; if (!ps) return;
        en.sets[si].w = ps.w; en.sets[si].r = ps.r; save(); rerenderSet(ei, si); return;
      }
      const wm = e.target.closest('[data-warm]'); if (wm) { const [ei, si] = wm.dataset.warm.split(':').map(Number); const st = state.active.entries[ei].sets[si]; st.warmup = !st.warmup; save(); render(); return; }
      const del = e.target.closest('[data-del]'); if (del) {
        const [ei, si] = del.dataset.del.split(':').map(Number);
        if (await confirmDlg('Delete set?', 'Set ' + (si + 1) + ' will be removed.', 'Delete', true)) { state.active.entries[ei].sets.splice(si, 1); save(); render(); } else render();
        return;
      }
      const ad = e.target.closest('[data-addset]'); if (ad) {
        const en = state.active.entries[+ad.dataset.addset]; const last = en.sets[en.sets.length - 1];
        en.sets.push({ w: last ? last.w : 0, r: last ? last.r : 0, warmup: false, done: false }); save(); render(); return;
      }
      const mn = e.target.closest('[data-exmenu]'); if (mn) {
        const ei = +mn.dataset.exmenu, en = state.active.entries[ei], ex = exById[en.exId];
        const v = await modal({ title: ex.name, html: '<label class="field"><span>Rest between sets (seconds) — saved as this exercise\'s default</span><input class="in num" id="m-rest" type="number" inputmode="numeric" value="' + en.rest + '"></label>',
          buttons: [{ label: 'Remove exercise', danger: true, value: 'remove' }, { label: 'Save', primary: true, onValue: m => ({ rest: Math.max(0, Math.floor(+$('#m-rest', m).value || 0)) }) }] });
        if (v === 'remove') { if (await confirmDlg('Remove ' + ex.name + '?', 'Its sets in this workout will be lost.', 'Remove', true)) { state.active.entries.splice(ei, 1); save(); render(); } }
        else if (v && v.rest != null) { en.rest = v.rest; state.exRest[en.exId] = v.rest; save(); render(); }
      }
  });
}

// ---------- boot ----------
function seedDemo() {
  const now = Date.now(), mk = (d, ex, rid) => ({ id: uid(), date: now - d * DAY + 36e5 * 10, name: 'Demo', routineId: rid || null, entries: Object.keys(ex).map(k => ({ exId: k, sets: ex[k].map(([w, r]) => ({ w, r, warmup: false })) })) });
  const S = [];
  for (let i = 0; i < 8; i++) {
    const d = 56 - i * 7;
    if (i === 5) continue; // a missed week, so the streak shield shows
    S.push(mk(d, { bb_bench: [[135 + i * 4, 6], [135 + i * 4, 6], [135 + i * 4, 5]], bb_ohp: [[85 + i * 2, 6], [85 + i * 2, 6], [85 + i * 2, 5]], bw_pullup: [[0, 6 + Math.floor(i / 2)], [0, 6], [0, 5]] }, 'demoA'));
    S.push(mk(d - 1, { bb_squat: [[205, 8], [205, 8], [205, 8]], bb_rdl: [[185 + i * 3, 8], [185 + i * 3, 8], [185 + i * 3, 8]] }, 'demoB'));
    S.push(mk(d - 2, { bb_deadlift: [[255 + i * 5, 5], [255 + i * 5, 5]], bb_row: [[135 + i * 2, 8], [135 + i * 2, 8], [135 + i * 2, 8]] }));
  }
  state.sessions = S.filter(s => s.date <= now);
  state.routines = [
    { id: 'demoA', name: 'Upper A', items: [{ exId: 'bb_bench', sets: 3, reps: 6, restSec: 150 }, { exId: 'bb_ohp', sets: 3, reps: 6, restSec: 120 }, { exId: 'bw_pullup', sets: 3, reps: 8, restSec: 120 }] },
    { id: 'demoB', name: 'Lower A', items: [{ exId: 'bb_squat', sets: 3, reps: 8, restSec: 180 }, { exId: 'bb_rdl', sets: 3, reps: 8, restSec: 150 }] },
  ];
  state.game.xp = 2600; state.profile.name = 'Sung';
  invalidate(); checkAchievements(); state.game.rank = currentRank(); save();
}
load(); buildEx(); bindWorkoutDelegates();
if (location.search.includes('demo') && !state.sessions.length && !state.active) {
  seedDemo();
  if (location.search.includes('active')) { const r = state.routines[0]; state.active = { id: uid(), startedAt: Date.now() - 14 * 60000, name: r.name, routineId: r.id, entries: [], rest: null }; r.items.forEach(it => addExerciseToActive(it.exId, it.sets, it.reps, it.restSec)); state.active.entries[0].sets[0].done = true; state.active.entries[0].sets[1].done = true; save(); }
}
const hashTab = location.hash.replace('#', '');
if (['workout', 'routines', 'progress', 'profile'].includes(hashTab)) tab = hashTab;
if (state.active && !hashTab) tab = 'workout';
render(); updateRest();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(g => { persistState = !!g; if (tab === 'profile') render(); }).catch(() => { persistState = false; });
else persistState = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!state.active && (tab === 'profile' || tab === 'workout')) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Installed. Open Arise from your home screen.'); render(); });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
  // a new version was fetched in the background: offer a one-tap refresh instead of silently showing it next time
  const offer = () => { const t = $('#toast'); t.textContent = 'Update ready. Tap to refresh.'; t.className = 'toast on'; clearTimeout(toastT); t.onclick = () => location.reload(); toastT = setTimeout(() => { t.classList.remove('on'); t.onclick = null; }, 8000); };
  reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w || !navigator.serviceWorker.controller) return; w.addEventListener('statechange', () => { if (w.state === 'activated') offer(); }); });
}).catch(() => {}));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { load(); buildEx(); invalidate(); updateRest(); if (!picker) render(); requestWake(); } });
window.ARISE_DEBUG = { showRankUp, rankCard };
window.addEventListener('pagehide', save);
window.ARISE = { get state() { return state; }, render, seedDemo };
})();
