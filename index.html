<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0A0B0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Strength log that tells you how much stronger you got, and what to do when a lift stalls.">
<title>Arise</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0A0B0F; --s1:#14161C; --s2:#1B1E26; --s3:#232732;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#F2F4F8; --tx2:#9AA3B2; --tx3:#5F6776;
  --cy:#3EE6FF; --cy-tint:rgba(62,230,255,.13); --cy-line:rgba(62,230,255,.35); --cy-ink:#061014;
  --gr:#B6FF3B; --gr-tint:rgba(182,255,59,.13);
  --rd:#FF5C5C; --rd-tint:rgba(255,92,92,.12);
  --r:12px; --t:160ms;
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Geist Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-s:13px; --fs-m:15px; --fs-l:20px; --fs-xl:34px;
  --tabs:64px; --sab:env(safe-area-inset-bottom,0px); --sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--f-ui);font-size:var(--fs-m);line-height:1.4;overflow-x:hidden;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--tx2)}.dim{color:var(--tx3)}.cy{color:var(--cy)}.gr{color:var(--gr)}.rd{color:var(--rd)}
.small{font-size:var(--fs-s)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}
h1{font-size:var(--fs-l);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h2{font-size:var(--fs-m);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{min-height:100%;padding-bottom:calc(var(--tabs) + var(--sab) + 12px)}
.screen{padding:calc(12px + var(--sat)) 16px 24px;max-width:560px;margin:0 auto;animation:fade var(--t) ease-out}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;margin-bottom:14px}
.top h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--s1);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card.lift{padding:16px}
.hair{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);font-weight:600;font-size:var(--fs-m);transition:transform var(--t),background var(--t),opacity var(--t);user-select:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--cy);color:var(--cy-ink);box-shadow:0 0 0 1px rgba(62,230,255,.2),0 8px 28px -10px rgba(62,230,255,.7)}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line2)}
.btn.danger{background:var(--rd-tint);color:var(--rd)}
.btn.full{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:var(--fs-s)}
.btn:disabled{opacity:.4;pointer-events:none}
.icon-btn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r);color:var(--tx2)}
.icon-btn:active{background:var(--s2)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* inputs */
.field{display:block;margin-bottom:12px}
.field label{display:block;font-size:var(--fs-s);color:var(--tx2);margin-bottom:6px}
.in{width:100%;min-height:48px;background:var(--s2);border:0;border-radius:var(--r);padding:0 14px;color:var(--tx);outline:none;transition:box-shadow var(--t)}
.in:focus{box-shadow:inset 0 0 0 1.5px var(--cy)}
.in.num{text-align:center;font-size:var(--fs-l)}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.seg{display:flex;background:var(--s2);border-radius:var(--r);padding:3px;gap:3px}
.seg button{flex:1;min-height:42px;border-radius:9px;color:var(--tx2);font-weight:600}
.seg button.on{background:var(--s3);color:var(--cy)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabs) + var(--sab));padding-bottom:var(--sab);background:var(--s1);border-top:1px solid var(--line);display:flex;z-index:30}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tx3);font-size:11px;font-weight:600;letter-spacing:.04em}
.tabs button.on{color:var(--cy)}
.tabs svg.i{width:24px;height:24px}

/* rest bar */
.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--tabs) + var(--sab) + 10px);background:var(--s2);border-radius:var(--r);box-shadow:0 12px 30px -10px rgba(0,0,0,.8),0 0 0 1px var(--line);z-index:29;overflow:hidden;transform:translateY(120%);transition:transform var(--t)}
.rest.on{transform:none}
.rest .bar{position:absolute;left:0;top:0;bottom:0;background:var(--cy-tint);transition:width 1s linear}
.rest .inner{position:relative;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 16px;min-height:52px}
.rest .time{font-size:var(--fs-l);color:var(--cy);min-width:64px}
.rest .btn{min-height:40px;padding:0 14px}

/* level ring / hero */
.hero{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--s3)}
.ring .fg{stroke:var(--cy);stroke-linecap:round;transition:stroke-dashoffset 400ms ease}
.ring .rank{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:30px;font-weight:700;color:var(--cy);letter-spacing:-.02em}
.bigval{font-size:var(--fs-xl);line-height:1;letter-spacing:-.02em}
.prog{height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--cy);border-radius:3px;transition:width 400ms ease}
.prog.green>i{background:var(--gr)}

/* workout set table */
.exh{display:flex;align-items:center;gap:8px;margin:0 0 6px;min-height:44px}
.exh h2{flex:1;min-width:0;font-size:17px}
.exsub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:-4px 0 8px;padding:0 2px;font-size:var(--fs-s);color:var(--tx2)}
.exsub .tgt{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;background:var(--cy-tint);color:var(--cy);font-family:var(--f-num);font-weight:600;font-size:12px}
.exsub .ld{color:var(--tx3)}
.exsub .tgt.up{background:var(--gr-tint);color:var(--gr);border:0;cursor:pointer;height:32px;padding:0 12px}
.exsub .tgt.up:active{transform:scale(.97)}
.thead,.set{display:grid;grid-template-columns:44px 1fr 1fr 1fr 48px;gap:6px;align-items:center}
.thead{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600;text-align:center;padding:2px 0 6px}
.thead>:first-child{text-align:left;padding-left:8px}
.set-wrap{position:relative;overflow:hidden;border-radius:10px;margin-bottom:6px}
.set-del{position:absolute;right:0;top:0;bottom:0;width:80px;background:var(--rd);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:var(--fs-s);border-radius:0 10px 10px 0}
.set{position:relative;background:var(--s1);padding:4px 4px 4px 0;border-radius:10px;transition:transform var(--t),background var(--t);touch-action:pan-y}
.set.done{background:#11272E}
.set.done .in{background:transparent}
.set.pr{animation:prflash 700ms ease-out}
@keyframes prflash{0%{background:#202B15;box-shadow:0 0 0 2px var(--gr)}100%{background:#11272E;box-shadow:none}}
.set .n{height:44px;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--tx2);border-radius:8px;font-family:var(--f-num)}
.set .n.w{color:var(--cy);font-size:var(--fs-s);letter-spacing:.06em}
.set .prev{height:48px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-family:var(--f-num);font-size:var(--fs-m);font-weight:500;border-radius:8px}
.set .prev:active{background:var(--s3);color:var(--tx)}
.set .in{height:48px;min-height:0;padding:0 4px;font-size:18px}
.set .ck{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--s2);color:var(--tx3);transition:background var(--t),color var(--t)}
.set.done .ck{background:var(--cy);color:var(--cy-ink);box-shadow:0 4px 16px -6px rgba(62,230,255,.7)}
.set.done .ck svg{animation:pop 200ms ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.exstats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 8px 2px;font-size:var(--fs-s);color:var(--tx2);min-height:28px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.badge.pr{background:var(--gr-tint);color:var(--gr)}
.badge.stall{background:var(--rd-tint);color:var(--rd)}
.badge.cy{background:var(--cy-tint);color:var(--cy)}
.badge.dimb{background:var(--s2);color:var(--tx2)}
.addset{width:100%;min-height:44px;color:var(--tx2);font-weight:600;border-radius:10px;background:var(--s1);margin-top:2px}
.addset:active{background:var(--s2)}
.exblock{margin-bottom:20px}
.name-in{background:transparent;border:0;outline:none;font-weight:700;font-size:var(--fs-l);letter-spacing:.02em;width:100%;min-height:44px;border-radius:8px;padding:0 6px;margin-left:-6px}
.name-in:focus{background:var(--s1)}
.timer{color:var(--tx2);font-size:var(--fs-m)}

/* list rows */
.lrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;border-radius:10px}
.lrow:active{background:var(--s2)}
.lrow .t{font-weight:600}
.lrow .s{font-size:var(--fs-s);color:var(--tx3)}
.lrow+.lrow{border-top:1px solid var(--line)}
.chk{width:26px;height:26px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line2);display:flex;align-items:center;justify-content:center;color:var(--cy-ink);flex:none}
.chk.on{background:var(--cy);box-shadow:none}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity var(--t)}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;top:calc(var(--sat) + 40px);background:var(--bg);border-radius:18px 18px 0 0;z-index:41;transform:translateY(100%);transition:transform 200ms ease-out;display:flex;flex-direction:column;box-shadow:0 -1px 0 var(--line)}
.sheet.on{transform:none}
.sheet .sh{padding:12px 16px 8px}
.sheet .body{flex:1;overflow-y:auto;padding:0 16px;-webkit-overflow-scrolling:touch}
.sheet .foot{padding:10px 16px calc(12px + var(--sab));border-top:1px solid var(--line);background:var(--s1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;background:var(--s2);color:var(--tx2);font-size:var(--fs-s);font-weight:600;white-space:nowrap}
.chip.on{background:var(--cy);color:var(--cy-ink)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--t)}
.modal-bg.on{opacity:1;pointer-events:auto}
.modal{width:100%;max-width:560px;background:var(--s1);border-radius:18px 18px 0 0;padding:20px 16px calc(16px + var(--sab));transform:translateY(20px);transition:transform var(--t);max-height:90vh;overflow-y:auto}
.modal-bg.on .modal{transform:none}
.modal h2{font-size:var(--fs-l);margin-bottom:8px}
.modal p{color:var(--tx2);margin-bottom:12px}
.modal .acts{display:flex;gap:10px;margin-top:16px}
.modal .acts .btn{flex:1}
.toast{position:fixed;left:16px;right:16px;top:calc(var(--sat) + 12px);z-index:60;background:var(--s3);color:var(--tx);padding:12px 16px;border-radius:var(--r);font-weight:600;box-shadow:0 10px 30px -10px rgba(0,0,0,.8),0 0 0 1px var(--line);transform:translateY(-140%);transition:transform 200ms ease-out;text-align:center}
.toast.on{transform:none}
.toast.pr{color:var(--gr);box-shadow:0 10px 30px -10px rgba(0,0,0,.8),0 0 0 1px rgba(182,255,59,.4)}

/* progress */
.readout{font-size:17px;line-height:1.5;font-weight:500}
.spark{width:100%;height:44px;display:block}
.tier{margin-top:12px}
.tier .segs{display:flex;gap:3px;height:10px}
.tier .segs i{flex:1;position:relative;background:var(--s3);border-radius:3px;overflow:hidden}
.tier .segs i b{position:absolute;left:0;top:0;bottom:0;background:var(--cy-line);border-radius:3px}
.tier .segs i u{position:absolute;left:0;top:0;bottom:0;background:var(--cy);border-radius:3px}
.tier .labs{display:flex;margin-top:5px}
.tier .labs span{flex:1;text-align:center;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.tier .labs span.on{color:var(--cy)}
.callout{margin-top:12px;padding:12px 14px;background:var(--rd-tint);border-left:3px solid var(--rd);border-radius:8px}
.callout b{display:block;color:var(--rd);margin-bottom:4px}
.callout p{color:var(--tx);font-size:var(--fs-s);line-height:1.45}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 .card{margin:0;padding:12px}
.stat3 .v{font-size:24px}
/* characters: illustrated hunters (art/chars) with the System's muscle map below the neck, trained muscles lit green.
   Only opacity and transform animate. */
.bodymap{position:relative;display:flex;justify-content:center;gap:2%;padding:16px 4px 2px;overflow:hidden}
.bodymap::before{content:"";position:absolute;inset:4px;pointer-events:none;opacity:.55;background-repeat:no-repeat;
  background-image:linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy)),linear-gradient(var(--cy),var(--cy));
  background-size:18px 1.5px,1.5px 18px,18px 1.5px,1.5px 18px,18px 1.5px,1.5px 18px,18px 1.5px,1.5px 18px;
  background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%}
.bodymap::after{content:"";position:absolute;left:4px;right:4px;height:40%;top:0;transform:translateY(-100%);pointer-events:none;background:linear-gradient(transparent,rgba(62,230,255,.06),transparent);animation:bmscan 5s linear infinite}
@keyframes bmscan{to{transform:translateY(260%)}}
.char{position:relative;width:48%}
.char .stage{position:relative}
.char .stage > svg.fig{position:relative;width:100%;height:auto;overflow:visible;display:block}
.char .aura{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible;pointer-events:none;opacity:var(--a);animation:bmbreathe 3.4s ease-in-out infinite;will-change:opacity,transform}
@keyframes bmbreathe{0%,100%{opacity:calc(var(--a) * .78);transform:translateY(0) scale(1)}50%{opacity:var(--a);transform:translateY(-1.2%) scale(1.012)}}
.char .ring{position:absolute;left:50%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%) scaleY(.26);pointer-events:none}
.char .ring svg{width:100%;height:100%;overflow:visible;animation:bmspin 18s linear infinite}
.char .ring svg.r2{animation-direction:reverse;animation-duration:26s}
.char .ring circle{fill:none;stroke:var(--cy)}
@keyframes bmspin{to{transform:rotate(360deg)}}
.char .lab2{text-align:center;margin-top:30px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.char path{vector-effect:non-scaling-stroke}
.char .sil{fill:#07090D;stroke:rgba(62,230,255,.35);stroke-width:.8}
.char .mu{fill:#141C25;stroke:rgba(62,230,255,.55);stroke-width:.6;stroke-linejoin:round;cursor:pointer;-webkit-tap-highlight-color:transparent}
.char .mu.lit{fill:var(--gr);stroke:rgba(182,255,59,.9)}
.char .pn{fill:#10161E;stroke:rgba(62,230,255,.4);stroke-width:.6;stroke-linejoin:round;pointer-events:none}
.char .fib{pointer-events:none;stroke:none}
.char .glow{pointer-events:none;fill:var(--gr)}
.char .halo{position:absolute;left:0;top:0;width:100%;height:auto;overflow:visible;pointer-events:none;mix-blend-mode:screen;opacity:.4;animation:bmglow 2.4s ease-in-out infinite;will-change:opacity}
@keyframes bmglow{0%,100%{opacity:.2}50%{opacity:.55}}
.bm-hud{display:flex;justify-content:space-between;gap:8px;margin:2px 2px 0;font-family:var(--f-num);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#58798A}
.bm-hud b{color:var(--cy)}
@media (prefers-reduced-motion:reduce){.char .halo,.char .aura,.char .ring svg,.bodymap::after{animation:none}}
/* first-run setup */
body.setup-on .tabs,body.setup-on .rest{display:none}
.setup{position:relative;margin-top:6px;padding:22px 18px 18px;border:1px solid var(--cy-line);border-radius:4px;overflow:hidden;
  background:linear-gradient(180deg,rgba(62,230,255,.07),rgba(62,230,255,.015));box-shadow:0 0 40px -14px rgba(62,230,255,.55),inset 0 0 30px -12px rgba(62,230,255,.3);animation:suin .45s ease-out}
.setup::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(62,230,255,.03) 0 1px,transparent 1px 3px)}
.setup > *{position:relative}
@keyframes suin{from{opacity:0;transform:scaleY(.96)}}
.su-head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.su-bang{width:26px;height:26px;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--cy);color:var(--cy);font-family:var(--f-num);font-weight:700;box-shadow:0 0 10px -2px var(--cy)}
.su-sys{font-family:var(--f-num);font-weight:700;letter-spacing:.3em;font-size:13px}
.su-dots{margin-left:auto;display:flex;gap:6px}
.su-dots i{width:18px;height:3px;border-radius:2px;background:var(--s3)}
.su-dots i.done{background:var(--cy-line)}
.su-dots i.on{background:var(--cy);box-shadow:0 0 8px var(--cy)}
.su-h{font-family:var(--f-num);font-size:21px;line-height:1.25;letter-spacing:.06em;text-transform:uppercase;margin:2px 0 8px;color:#F2FDFF;text-shadow:0 0 18px rgba(62,230,255,.45)}
.su-p{color:var(--tx2);line-height:1.5;margin:0 0 16px}
.su-go{width:100%;margin-top:6px;font-family:var(--f-num);letter-spacing:.2em}
.su-go[disabled]{opacity:.35;box-shadow:none}
.su-back{display:block;margin:8px auto 0;min-height:44px;padding:0 14px;color:var(--tx2);font-size:14px}
.su-chars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}

let cache = null;

function bindDrag() {

// dated e1RM chart: y labels, first/last dates, dashed baseline, area fill, endpoint dot
function liftChart(a) {
  const h = a.history, W = 100, H = 56, L = 16, R = 4, T = 6, B = 12;
  if (h.length < 2) return '<div class="small dim" style="margin-top:10px">Chart appears after a second session.</div>';
  const xs = h.map(x => x.date), ys = h.map(x => x.best).concat(a.formed ? [a.baseline] : []);
  const x0 = Math.min(...xs), x1 = Math.max(...xs); let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < y1 * 0.05) { y0 = y0 * 0.97; y1 = y1 * 1.03; }
  const px = x => L + (W - L - R) * (x - x0) / (x1 - x0), py = y => T + (H - T - B) * (1 - (y - y0) / (y1 - y0));
  const pts = h.map(p => px(p.date).toFixed(1) + ',' + py(p.best).toFixed(1));
  const last = h[h.length - 1];
  const area = 'M' + pts[0] + ' L' + pts.join(' L') + ' L' + px(last.date).toFixed(1) + ',' + (H - B) + ' L' + px(h[0].date).toFixed(1) + ',' + (H - B) + ' Z';

    '<line class="grid" x1="' + L + '" y1="' + T + '" x2="' + (W - R) + '" y2="' + T + '"/><line class="grid" x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '"/>' +
    '<text x="' + (L - 2) + '" y="' + (T + 2) + '" text-anchor="end">' + fw(y1) + '</text><text x="' + (L - 2) + '" y="' + (H - B + 1) + '" text-anchor="end">' + fw(y0) + '</text>' +
    (a.formed ? '<line class="base" x1="' + L + '" y1="' + py(a.baseline).toFixed(1) + '" x2="' + (W - R) + '" y2="' + py(a.baseline).toFixed(1) + '"/>' : '') +

    '<text x="' + L + '" y="' + (H - 2) + '">' + dl(h[0].date) + '</text><text x="' + (W - R) + '" y="' + (H - 2) + '" text-anchor="end">' + dl(last.date) + '</text></svg>';
}

  });
  s.addEventListener('click', async e => {
      if (tab !== 'workout' || !state.active) return;
      const ck = e.target.closest('[data-ck]'); if (ck) { const [ei, si] = ck.dataset.ck.split(':').map(Number); completeSet(ei, si); return; }
      const pv = e.target.closest('[data-prev]'); if (pv) {
        const [ei, si] = pv.dataset.prev.split(':').map(Number); const en = state.active.entries[ei]; const p = prevEntry(en.exId); const ps = p && p.sets[si]; if (!ps) return;
        en.sets[si].w = ps.w; en.sets[si].r = ps.r; save(); rerenderSet(ei, si); return;
      }
      const wm = e.target.closest('[data-warm]'); if (wm) { const [ei, si] = wm.dataset.warm.split(':').map(Number); const st = state.active.entries[ei].sets[si]; st.warmup = !st.warmup; save(); render(); return; }
      const del = e.target.closest('[data-del]'); if (del) {
        const [ei, si] = del.dataset.del.split(':').map(Number);
        if (await confirmDlg('Delete set?', 'Set ' + (si + 1) + ' will be removed.', 'Delete', true)) { state.active.entries[ei].sets.splice(si, 1); save(); render(); } else render();
        return;
      }
      const bp = e.target.closest('[data-bump]'); if (bp) {
        const en = state.active.entries[+bp.dataset.bump];
        for (const s of en.sets) if (!s.done && !s.warmup) { s.w = en.bump.to; s.r = 0; }
        en.bumped = true; save(); render(); toast('Loaded ' + fw(en.bump.to) + ' ' + wHead(exById[en.exId]) + '. Expect a few fewer reps.'); return;
      }
      const ad = e.target.closest('[data-addset]'); if (ad) {
        const en = state.active.entries[+ad.dataset.addset]; const last = en.sets[en.sets.length - 1];
        en.sets.push({ w: last ? last.w : 0, r: last ? last.r : 0, warmup: false, done: false }); save(); render(); return;
      }
      const mn = e.target.closest('[data-exmenu]'); if (mn) {
        const ei = +mn.dataset.exmenu, en = state.active.entries[ei], ex = exById[en.exId];
        const v = await modal({ title: ex.name, html: '<label class="field"><span>Rest between sets (seconds) — saved as this exercise\'s default</span><input class="in num" id="m-rest" type="number" inputmode="numeric" value="' + en.rest + '"></label>',
          buttons: [{ label: 'Remove exercise', danger: true, value: 'remove' }, { label: 'Save', primary: true, onValue: m => ({ rest: Math.max(0, Math.floor(+$('#m-rest', m).value || 0)) }) }] });
        if (v === 'remove') { if (await confirmDlg('Remove ' + ex.name + '?', 'Its sets in this workout will be lost.', 'Remove', true)) { state.active.entries.splice(ei, 1); save(); render(); } }
        else if (v && v.rest != null) { en.rest = v.rest; state.exRest[en.exId] = v.rest; save(); render(); }
      }
  });
}

// ---------- boot ----------
function seedDemo() {
  const now = Date.now(), mk = (d, ex, rid) => ({ id: uid(), date: now - d * DAY + 36e5 * 10, name: 'Demo', routineId: rid || null, entries: Object.keys(ex).map(k => ({ exId: k, sets: ex[k].map(([w, r]) => ({ w, r, warmup: false })) })) });
  const S = [];
  for (let i = 0; i < 8; i++) {
    const d = 56 - i * 7;
    if (i === 5) continue; // a missed week, so the streak shield shows
    S.push(mk(d, { bb_bench: [[135 + i * 4, 6], [135 + i * 4, 6], [135 + i * 4, 5]], bb_ohp: [[85 + i * 2, 6], [85 + i * 2, 6], [85 + i * 2, 5]], bw_pullup: [[0, 6 + Math.floor(i / 2)], [0, 6], [0, 5]] }, 'demoA'));
    S.push(mk(d - 1, { bb_squat: [[205, 8], [205, 8], [205, 8]], bb_rdl: [[185 + i * 3, 8], [185 + i * 3, 8], [185 + i * 3, 8]] }, 'demoB'));
    S.push(mk(d - 2, { bb_deadlift: [[255 + i * 5, 5], [255 + i * 5, 5]], bb_row: [[135 + i * 2, 8], [135 + i * 2, 8], [135 + i * 2, 8]] }));
  }
  state.sessions = S.filter(s => s.date <= now);
  state.routines = [
    { id: 'demoA', name: 'Upper A', items: [{ exId: 'bb_bench', sets: 3, reps: 6, restSec: 150 }, { exId: 'bb_ohp', sets: 3, reps: 6, restSec: 120 }, { exId: 'bw_pullup', sets: 3, reps: 8, restSec: 120 }] },
    { id: 'demoB', name: 'Lower A', items: [{ exId: 'bb_squat', sets: 3, reps: 8, restSec: 180 }, { exId: 'bb_rdl', sets: 3, reps: 8, restSec: 150 }] },
  ];
  state.game.xp = 2600; state.profile.name = 'Sung'; state.profile.setupDone = true;
  invalidate(); checkAchievements(); state.game.achVersion = TITLES_VERSION;
  state.game.unseen = location.search.includes('sealedall') ? state.game.unseen : location.search.includes('sealed') ? state.game.unseen.slice(0, 2) : [];
  state.game.rank = currentRank(); save();
}
load(); buildEx(); bindWorkoutDelegates();
if (location.search.includes('demo') && !state.sessions.length && !state.active) {
  seedDemo();
  if (location.search.includes('active')) { const r = state.routines[0]; state.active = { id: uid(), startedAt: Date.now() - 14 * 60000, name: r.name, routineId: r.id, entries: [], rest: null }; r.items.forEach(it => addExerciseToActive(it.exId, it.sets, it.reps, it.restSec, it.repsMax)); state.active.entries[0].sets[0].done = true; state.active.entries[0].sets[1].done = true; save(); }
}
// New titles are checked against the whole log once, so history counts. They arrive sealed, on the home banner.
if ((state.game.achVersion || 0) < TITLES_VERSION) { if (state.sessions.length) checkAchievements(); state.game.achVersion = TITLES_VERSION; save(); }
if (window.ARISE_SFX) { window.ARISE_SFX.enabled = P().sound !== false; document.addEventListener('pointerdown', () => window.ARISE_SFX.unlock(), true); }
const hashTab = location.hash.replace('#', '');
if (['workout', 'routines', 'calendar', 'progress', 'profile'].includes(hashTab)) tab = hashTab;
if (hashTab === 'titles') { tab = 'profile'; sub = { view: 'titles' }; }
if (state.active && !hashTab) tab = 'workout';
render(); updateRest();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(g => { persistState = !!g; if (tab === 'profile') render(); }).catch(() => { persistState = false; });
else persistState = false;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!state.active && (tab === 'profile' || tab === 'workout')) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Installed. Open Arise from your home screen.'); render(); });
// The service worker is network-first, so every open fetches the latest deploy; it also re-checks
// for a new worker on every launch and when the app comes back to the foreground.
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
  reg.update().catch(() => {});
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
}).catch(() => {}));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { load(); buildEx(); invalidate(); updateRest(); if (!picker) render(); requestWake(); } });
window.ARISE_DEBUG = { showRankUp, rankCard, revealTitles, titleStats, checkAchievements };
window.addEventListener('pagehide', save);
window.ARISE = { get state() { return state; }, render, seedDemo };
})();
</script>
